name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm appstream base-devel cmake dbus desktop-file-utils git glib2 jq libsecret ninja python qt6-base qt6-declarative qt6-networkauth sqlite
      - uses: actions/checkout@v4
      - name: Create unprivileged test user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Verify production install tree
        run: ./tests/test-package-install.sh
      - name: Build service for integration contracts
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-ci
      - name: Render visual smoke matrix
        run: ./tests/capture-visual-baseline.sh "$PWD/build-ci/omarchy-calendar" "$PWD/build-ci/omarchy-calendar-service" /tmp/omarchy-calendar-visuals
      - name: Run contracts
        run: runuser -u builder -- ./tests/run-contract-tests.sh "$PWD/build-ci/omarchy-calendar-service"

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm base-devel git namcap python sudo
      - uses: actions/checkout@v4
      - name: Prepare source and AUR files with a test desktop client
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          printf '%s\n' \
            'OMARCHY_CALENDAR_GOOGLE_CLIENT_ID=ci-test.apps.googleusercontent.com' \
            'OMARCHY_CALENDAR_GOOGLE_CLIENT_SECRET=ci-test-secret' > /tmp/ci-oauth.env
          runuser -u builder -- python3 packaging/prepare-release.py \
            --ref HEAD --oauth-env /tmp/ci-oauth.env --output build-aur-ci
      - name: Build in the fresh Arch container using declared dependencies
        run: runuser -u builder -- bash -c 'cd build-aur-ci/aur && makepkg --syncdeps --cleanbuild --noconfirm'
      - name: Validate package contents and dependencies
        run: ./tests/check-arch-package.sh build-aur-ci/aur
      - name: Save test sources for Omarchy builds
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-test-sources
          path: build-aur-ci/*.tar.gz
          retention-days: 7

  omarchy-package:
    needs: arch-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check out reviewed Omarchy build tooling
        uses: actions/checkout@v4
        with:
          repository: omacom/omarchy-pkgs
          ref: 1ede7396405e98eb987fc58e1a015b1aa7e032da
          path: build-opr
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: omarchy-test-sources
          path: build-opr-input
      - name: Stage recipe and locally prepared test source
        run: |
          version=$(sed -n 's/^#define OMARCHY_CALENDAR_VERSION "\([^"]*\)"/\1/p' app/version.h)
          tar -xzf "build-opr-input/omarchy-calendar-$version-opr.tar.gz" -C build-opr
          cp "build-opr-input/omarchy-calendar-$version.tar.gz" build-opr/pkgbuilds/omarchy-calendar/
          python3 build-opr/helpers/upstream-watch.py validate build-opr/pkgbuilds/omarchy-calendar
      - name: Bootstrap the builder with the pinned upstream public key
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil

          root = Path("build-opr")
          dockerfile = root / "build/Dockerfile"
          content = dockerfile.read_text()
          fetch = "RUN pacman-key --recv-keys 40DFB630FF42BCFFB047046CF0134EE680CAC571 --keyserver keys.openpgp.org"
          if content.count(fetch) != 1:
              raise SystemExit("Upstream key bootstrap changed; review before patching")
          # Use the keyring from the same pinned upstream commit. Keep the
          # fingerprint-specific trust step and all package signature checks.
          shutil.copyfile(root / "pkgbuilds/omarchy-keyring/omarchy.gpg",
                          root / "build/omarchy-bootstrap.gpg")
          replacement = ("COPY omarchy-bootstrap.gpg /tmp/omarchy-bootstrap.gpg\n"
                         "RUN pacman-key --add /tmp/omarchy-bootstrap.gpg")
          dockerfile.write_text(content.replace(fetch, replacement))
          PYTHON
      - name: Build with Omarchy's edge repositories
        run: sudo env CONTAINER_ENGINE=docker build-opr/bin/build --mirror edge --arch ${{ matrix.arch }} --package omarchy-calendar
      - name: Save unsigned test packages
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-test-packages-${{ matrix.arch }}
          path: build-opr/build-output/edge/${{ matrix.arch }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
