name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build as a draft release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      OMARCHY_CALENDAR_HOMEPAGE_URL: https://lastrefuge.ai/projects/omarchy-calendar
      OMARCHY_CALENDAR_PRIVACY_URL: https://lastrefuge.ai/privacy
      OMARCHY_CALENDAR_TERMS_URL: https://lastrefuge.ai/terms
      OMARCHY_CALENDAR_SUPPORT_EMAIL: jason@greatspark.com
    steps:
      - name: Install release dependencies
        run: pacman -Syu --noconfirm appstream base-devel cmake dbus desktop-file-utils git github-cli jq libsecret namcap ninja python qt6-base qt6-declarative qt6-networkauth sqlite xdg-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Create unprivileged build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Verify tag and release metadata
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          runuser -u builder -- env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" ./tests/test-release-metadata.sh
      - name: Configure production OAuth credentials
        run: |
          test -n "$OAUTH_CLIENT_ID"
          test -n "$OAUTH_CLIENT_SECRET"
          umask 077
          printf 'OMARCHY_CALENDAR_GOOGLE_CLIENT_ID=%s\nOMARCHY_CALENDAR_GOOGLE_CLIENT_SECRET=%s\n' \
            "$OAUTH_CLIENT_ID" "$OAUTH_CLIENT_SECRET" > packaging/google-oauth.env
      - name: Verify production install
        run: ./tests/test-package-install.sh
      - name: Build integration service
        run: >-
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DOMARCHY_CALENDAR_HOMEPAGE_URL="$OMARCHY_CALENDAR_HOMEPAGE_URL"
          -DOMARCHY_CALENDAR_PRIVACY_URL="$OMARCHY_CALENDAR_PRIVACY_URL"
          -DOMARCHY_CALENDAR_TERMS_URL="$OMARCHY_CALENDAR_TERMS_URL"
          -DOMARCHY_CALENDAR_SUPPORT_EMAIL="$OMARCHY_CALENDAR_SUPPORT_EMAIL"
          && cmake --build build-release
      - name: Run contracts
        run: runuser -u builder -- ./tests/run-contract-tests.sh "$PWD/build-release/omarchy-calendar-service"
      - name: Prepare and validate release artifacts
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- python3 packaging/prepare-release.py \
            --ref "$RELEASE_TAG" --oauth-env packaging/google-oauth.env --output dist
          runuser -u builder -- bash -c 'cd dist/aur && makepkg --noconfirm --cleanbuild'
          ./tests/check-arch-package.sh dist/aur
          cp dist/aur/omarchy-calendar-*.pkg.tar.zst dist/
          cd dist
          sha256sum ./*.tar.gz ./*.pkg.tar.zst SOURCE_REVISION > SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/*.tar.gz dist/*.pkg.tar.zst
          dist/SHA256SUMS dist/SOURCE_REVISION --generate-notes --verify-tag --draft
